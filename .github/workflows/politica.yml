name: Publicar Política

on:
  push:
    branches: [main]
    paths:
      - "Política/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Unir los .md en un solo HTML
        run: |
          mkdir -p _site
          pandoc Política/*.md \
            --standalone \
            --toc \
            --toc-depth=2 \
            --metadata title="Política de Bases de Datos" \
            --metadata lang=es \
            -o _site/index.html

      - name: Preparar el sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4